site_name: Rhythm
site_description: A collection of custom nodes for Dynamo. 315 of them, and now every one has help.
site_author: John Pierson
site_url: https://johnpierson.github.io/RhythmForDynamo/

repo_url: https://github.com/johnpierson/RhythmForDynamo
repo_name: johnpierson/RhythmForDynamo
edit_uri: edit/master/docs/

copyright: BSD 3-Clause licensed.

docs_dir: docs
site_dir: site

# See scripts/mkdocs_hooks.py. It rewrites the links that leave docs/ into absolute repository
# URLs, expands the `nodes/*` nav entry below, and turns each node page's example-graph filename
# into a download link. All three exist because docs/ is written to be read on GitHub first, and
# most of it is generated by tools/Rhythm.Docs.
hooks:
  - scripts/mkdocs_hooks.py

# Reference material a reader looks *up* is kept apart from the pages they read *through*.
# docs/nodes/ — one generated file per node — expands automatically.
nav:
  - Home: README.md
  - Installing: installing.md
  - Reference:
      - Node reference: node-reference.md
      - Node help: nodes/*
  - Contributing:
      - Writing node help: writing-node-help.md

theme:
  name: material
  language: en
  logo: assets/rhythm-mark.svg
  favicon: assets/rhythm-mark.svg
  # No Google Fonts request. The site is set in Space Grotesk, served from the four static faces
  # checked in under docs/assets/fonts — see docs/stylesheets/extra.css.
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tooltips
  palette:
    # The same Neubrutalist palettes the Interlude site is set in, so the two packages read as
    # coming from the same hand. Light leads because that is what the screenshots in docs/nodes
    # were captured against; dark is the light palette inverted rather than dimmed.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light

extra_css:
  - stylesheets/extra.css

extra:
  # Read by the hook when it rewrites a link into a repository URL.
  repo_branch: master
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/johnpierson/RhythmForDynamo
      name: Rhythm on GitHub

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  # Every heading anchor referenced from one of the contents lists is checked. The node reference
  # is 91 headings deep and a stale entry there is the failure most worth catching.
  anchors: warn
