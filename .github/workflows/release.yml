name: Create Release

on:
  workflow_dispatch:
    inputs:
      minor_version:
        description: 'Minor version number (leave empty to auto-calculate)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - '20*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate CalVer version
        id: calver
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%-m)
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger
            if [ -n "${{ github.event.inputs.minor_version }}" ]; then
              MINOR="${{ github.event.inputs.minor_version }}"
            else
              # Auto-calculate: find highest minor version for current month
              echo "Auto-calculating minor version for ${YEAR}.${MONTH}..."
              MAX_MINOR=0
              
              # Get all tags matching the current year and month
              for tag in $(git tag -l "${YEAR}.${MONTH}.*"); do
                TAG_MINOR=$(echo $tag | cut -d'.' -f3)
                if [ -n "$TAG_MINOR" ] && [ "$TAG_MINOR" -gt "$MAX_MINOR" ] 2>/dev/null; then
                  MAX_MINOR=$TAG_MINOR
                fi
              done
              
              MINOR=$((MAX_MINOR + 1))
              echo "Found max minor version: ${MAX_MINOR}, using: ${MINOR}"
            fi
          else
            # Tag push - extract version from tag
            TAG_NAME="${{ github.ref_name }}"
            MINOR=$(echo $TAG_NAME | cut -d'.' -f3)
            YEAR=$(echo $TAG_NAME | cut -d'.' -f1)
            MONTH=$(echo $TAG_NAME | cut -d'.' -f2)
          fi
          
          VERSION="${YEAR}.${MONTH}.${MINOR}"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${VERSION}" >> $GITHUB_OUTPUT
          echo "Calculated CalVer version: ${VERSION}"

      - name: Generate release notes
        id: release_notes
        run: |
          NOTES=$(cat <<EOF
          ## Installation
          
          Installation available through package manager.
          
          ## Changes
          
          See commit history for detailed changes.
          EOF
          )
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Releases were markers only: no artifacts. What a user actually ran was whatever deploy/
      # happened to contain on master at the moment their first run downloaded it, so there was no
      # way to say which binaries a given "release" delivered, and no rollback point. Attaching the
      # binaries plus a checksum manifest makes a release a real, verifiable artifact set.
      # Two levels of checksum, because they answer different questions and a manifest whose paths
      # do not resolve is worse than none - it looks verifiable and fails when you try.
      #
      #   artifacts/SHA256SUMS.txt  covers the published release assets, by the bare filename
      #                             GitHub serves them under, so after downloading them into one
      #                             directory `sha256sum -c SHA256SUMS.txt` just works.
      #   SHA256SUMS.txt inside     covers that zip's own contents, with paths relative to the
      #   each zip                  zip root, so it resolves from wherever the zip is extracted.
      - name: Package deploy folder and checksums
        run: |
          set -euo pipefail
          mkdir -p artifacts
          version="${{ steps.calver.outputs.version }}"

          for year in 2020 2021 2022 2023 2024 2025 2026 2027; do
            if [ ! -d "deploy/${year}" ]; then
              echo "::warning::deploy/${year} is missing and was not packaged"
              continue
            fi

            # Stage so the zip root is the year folder itself; the manifest inside then uses the
            # same relative paths a user sees after extracting.
            rm -rf "stage/${year}"
            mkdir -p "stage/${year}"
            cp -r "deploy/${year}/." "stage/${year}/"

            ( cd "stage/${year}" \
              && find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum \
                 > SHA256SUMS.txt )

            # Checked explicitly rather than left to set -e: a subshell's failure does not reliably
            # abort the script, and a release that silently ships no assets is the failure mode
            # this whole step exists to prevent.
            if ! ( cd stage && zip -r -q "../artifacts/Rhythm-${year}-${version}.zip" "${year}" ); then
              echo "::error::failed to package deploy/${year}"
              exit 1
            fi
          done

          shopt -s nullglob
          zips=(artifacts/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::no release assets were produced"
            exit 1
          fi

          # Bare filenames only: GitHub publishes each asset under its basename, so recording a
          # path like artifacts/Rhythm-2024.zip would make -c fail for every downloader.
          ( cd artifacts && sha256sum *.zip > SHA256SUMS.txt )

          echo "Published assets and their checksums:"
          cat artifacts/SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.calver.outputs.tag_name }}
          name: Release ${{ steps.calver.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
