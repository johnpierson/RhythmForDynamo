name: Tweet New Release

# Controls when the action will run. 
on:
  # Triggers the workflow on release
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
 latest-version:
    runs-on: ubuntu-latest
    steps:
      # This used to call a third-party action pinned to @master - a mutable ref whose code could
      # change at any time, running in the same job that holds four Twitter credentials. The GitHub
      # CLI is already on the runner and needs no third-party code at all.
      - name: Get Latest Release
        id: fetch-latest-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo johnpierson/RhythmForDynamo --json tagName --jq .tagName)
          echo "release=${tag}" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${tag}"
      - uses: ethomson/send-tweet-action@v1
        with:
          status: "New Rhythm for #DynamoBIM Release: https://github.com/johnpierson/RhythmForDynamo/releases/tag/${{ steps.fetch-latest-release.outputs.release }}" 
          consumer-key: ${{ secrets.TWITTER_CONSUMER_API_KEY }}
          consumer-secret: ${{ secrets.TWITTER_CONSUMER_API_SECRET }}
          access-token: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          access-token-secret: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
